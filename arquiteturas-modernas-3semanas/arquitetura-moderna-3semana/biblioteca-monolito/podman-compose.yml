version: "3.9"

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: biblioteca-monolito-postgres
    environment:
      POSTGRES_DB: biblioteca_db
      POSTGRES_USER: biblioteca
      POSTGRES_PASSWORD: biblioteca
    ports:
      - "5432:5432"
    volumes:
      - biblioteca-monolito-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biblioteca -d biblioteca_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # sobe a própria app em contêiner (perfil "app"): podman-compose --profile app up -d
  app:
    build:
      context: .
      dockerfile: Containerfile
    container_name: biblioteca-monolito
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/biblioteca_db
      SPRING_DATASOURCE_USERNAME: biblioteca
      SPRING_DATASOURCE_PASSWORD: biblioteca
    ports:
      - "8080:8080"

volumes:
  biblioteca-monolito-pg-data:
