version: "3.9"

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: fdmts-2smn-postgres
    environment:
      POSTGRES_DB: fdmts-2smn-db
      POSTGRES_USER: fdmts
      POSTGRES_PASSWORD: fdmts123
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - fdmts-2smn-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fdmts -d fdmts-2smn-db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fdmts-2smn-pgdata:
